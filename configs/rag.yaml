# Wikipedia RAG configuration (T5). Ingestion/indexing are not implemented
# until T5; this file pins the target design now so interfaces don't shift.
ingestion:
  categories:            # Wikipedia page seeds per subject (curated, NOT the
                         # full dump; engineering rules forbid blind dumping)
    mathematics: [Algebra, Geometry, Calculus, Statistics, Number theory, Discrete mathematics]
    physics: [Mechanics, Electromagnetism, Thermodynamics, Quantum mechanics, Theory of relativity]
    chemistry: [Organic chemistry, Inorganic chemistry, Physical chemistry, Biochemistry]
    biology: [Cell biology, Genetics, Evolution, Molecular biology, Ecology]
    astronomy: [Astronomy, Star, Solar System]
    earth_science: [Geology, Meteorology, Oceanography]
    computer_science: [Computer science, Algorithm, Data structure]
  max_depth: 1                    # link expansion depth (0 = seed pages only)
  max_pages_per_subject: 40

chunking:
  chunk_size_tokens: 650          # target 500-1000; revisit after T5 retrieval eval
  chunk_overlap_tokens: 80
  preserve_sections: true         # keeps section heading per chunk

metadata_per_chunk: [title, pageid, url, section_heading, revision_id, license, chunk_id]

embedding:
  # T5.7: candidates were MEASURED (scripts/eval_embeddings.py, probe set
  # in rag/embeddings/embedding_decision.json); e5-small-v2 won on
  # retrieval quality (recall@1 0.80, MRR 0.90 vs 0.767/0.883) with
  # negligible latency cost (18.6 ms/query CPU). The decision file, not
  # this field, drives the index builder.
  model: intfloat/e5-small-v2                     # measured winner (T5.7)
  revision: ffb93f3bd4047442299a41ebb6fa998a38507c52
  batch_size: 64

retrieval:
  vector_store: faiss             # interface abstracted; swap later
  top_k: 5
  similarity_threshold: 0.30      # below => answer with explicit uncertainty
  min_sources_for_citation: 1