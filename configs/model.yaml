# Base model selection for ScienceMath-v0.1.
#
# These are CANDIDATES evaluated in T2 (baseline evaluation decides). None is
# "the chosen model" until evaluations/base/ contains measured results.
# License/metadata verification details live in evaluations/model_manifest.json
# (verified against primary HF pages on 2026-08-31).
#
# Memory guideline for 6 GB VRAM: max_model ~4B parameters with 4-bit QLoRA.
# Everything here is downloadable with a free Hugging Face account.
candidates:
  - name: Qwen/Qwen3-1.7B
    candidate_key: A
    params_b: 1.7
    license: apache-2.0
    license_verified: true
    context_length: 32768
    thinking_mode: dual (enable_thinking)
    notes: >
      PRIMARY general ScienceMath candidate: modern compact dual-mode
      reasoning model.
  - name: Qwen/Qwen2.5-Math-1.5B-Instruct
    candidate_key: B
    params_b: 1.5
    license: apache-2.0
    license_verified: true
    context_length: 4096
    thinking_mode: none
    notes: >
      Math-specialized CONTROL: measures specialized-vs-general math
      capability delta. Shorter context restricts RAG use (T5/T6).
  - name: Qwen/Qwen2.5-1.5B-Instruct
    candidate_key: C
    params_b: 1.54
    license: apache-2.0
    license_verified: true
    context_length: 32768
    thinking_mode: none
    notes: >
      OPTIONAL legacy/control baseline; run only after A and B if
      compute/storage/time permit.

